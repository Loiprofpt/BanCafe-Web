<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cửa Hàng Cà Phê – Pureva Craft</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        coffee: {
                            DEFAULT: '#634A36',
                            light: '#533E2D',
                            lighter: '#7A6452',
                            accent: '#F4E8D7',
                            gold: '#E0C294',
                            dark: '#634A36',
                        },
                        forest: {
                            DEFAULT: '#314F22',
                            hover: '#253B1A',
                            light: '#3C612B',
                        }
                    },
                    fontFamily: {
                        serif: ['Playfair Display', 'serif'],
                        sans: ['Montserrat', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap');
        
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #634A36;
            color: #F4E8D7;
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen bg-coffee-dark">

    <!-- Header / Navbar Container -->
    <header id="navbar-container" class="bg-coffee-dark/95 border-b border-coffee-lighter sticky top-0 z-40 backdrop-blur-sm">
        <!-- Will be loaded dynamically from app.js -->
    </header>

    <!-- Page Title Header -->
    <section class="relative py-16 bg-coffee bg-cover bg-center border-b border-coffee-lighter" style="background-image: url('https://images.unsplash.com/photo-1447933601403-0c6688de566e?q=80&w=2061&auto=format&fit=crop');">
        <div class="absolute inset-0 bg-black/70"></div>
        <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center space-y-3">
            <h1 class="text-3xl sm:text-4xl font-bold text-white">Cửa Hàng Cà Phê Hữu Cơ</h1>
            <p class="text-sm text-coffee-accent max-w-md mx-auto">Chọn lọc hương vị tinh tuý nhất từ Di Linh, Cầu Đất và Bảo Lộc (Gói chuẩn 250g)</p>
        </div>
    </section>

    <!-- Shop Content Section -->
    <main class="flex-grow py-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-8">
            <!-- Filter Bar -->
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-coffee-light border border-coffee-lighter p-4 rounded-lg">
                <span class="text-xs font-semibold text-coffee-gold uppercase tracking-wider">Hạt Cà Phê Đặc Sản</span>
                
                <div class="flex items-center space-x-3">
                    <label for="roast-filter" class="text-xs text-coffee-accent font-medium">Mức độ rang:</label>
                    <select id="roast-filter" onchange="filterProductsByRoast()" class="bg-coffee border border-coffee-lighter text-xs text-coffee-accent rounded px-3 py-1.5 focus:outline-none focus:border-coffee-gold">
                        <option value="All">Tất cả sản phẩm</option>
                        <option value="Light">Rang Nhạt (Light)</option>
                        <option value="Medium">Rang Vừa (Medium)</option>
                        <option value="Dark">Rang Đậm (Dark)</option>
                    </select>
                </div>
            </div>

            <!-- Product Grid -->
            <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                <!-- Products will be dynamically populated from app.js via WebView2 -->
                <div class="col-span-full flex flex-col justify-center items-center h-64 space-y-3">
                    <svg class="animate-spin h-8 w-8 text-coffee-gold" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span class="text-xs text-coffee-accent">Đang tải danh sách sản phẩm từ cơ sở dữ liệu...</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Container -->
    <footer id="footer-container" class="bg-coffee-dark border-t border-coffee-lighter text-coffee-accent">
        <!-- Will be loaded dynamically from app.js -->
    </footer>

    <!-- Shopping Cart Slide-out Drawer Container -->
    <div id="cart-drawer-container"></div>

    <!-- Product Detail Modal Container -->
    <div id="product-detail-modal-container" class="hidden"></div>

    <!-- Core App JS -->
    <script src="js/app.js"></script>

    <!-- Client-side filtering script -->
    <script>
        function filterProductsByRoast() {
            const filterVal = document.getElementById('roast-filter').value;
            const grid = document.getElementById('products-grid');
            if (!grid || products.length === 0) return;
            
            let filtered = products;
            if (filterVal !== "All") {
                filtered = products.filter(p => p.RoastOptions && p.RoastOptions.toLowerCase().includes(filterVal.toLowerCase()));
            }
            
            if (filtered.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center py-12 text-coffee-accent">Không tìm thấy sản phẩm nào có mức độ rang này.</p>`;
                return;
            }
            
            grid.innerHTML = filtered.map(prod => {
                const roastOpts = prod.RoastOptions ? prod.RoastOptions.split(',') : ['Medium'];
                const optionsHtml = roastOpts.map(opt => `<option value="${opt.trim()}">Rang ${opt.trim() === 'Light' ? 'Nhạt (Light)' : (opt.trim() === 'Medium' ? 'Vừa (Medium)' : 'Đậm (Dark)')}</option>`).join('');
                
                return `
                    <div class="bg-coffee-light border border-coffee-lighter rounded-lg overflow-hidden group shadow-lg flex flex-col justify-between hover:border-coffee-gold transition-all duration-300">
                        <div class="relative overflow-hidden aspect-square bg-coffee cursor-pointer" onclick="openProductDetail(${prod.Id})">
                            <img src="${prod.ImageUrl || 'images/blend.jpg'}" alt="${prod.Name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                            <span class="absolute top-2 right-2 bg-coffee-dark text-coffee-gold text-xs px-2.5 py-1 rounded-full border border-coffee-lighter font-sans">
                                ${prod.Unit}
                            </span>
                        </div>
                        <div class="p-6 flex-grow flex flex-col justify-between space-y-4">
                            <div>
                                <h3 class="font-serif text-lg font-bold text-white group-hover:text-coffee-gold transition-colors cursor-pointer" onclick="openProductDetail(${prod.Id})">${prod.Name}</h3>
                            </div>
                            
                            <div class="space-y-4 pt-2">
                                <div class="flex justify-between items-center border-b border-coffee-lighter pb-2">
                                    <span class="text-xl font-bold text-coffee-gold">${formatMoney(prod.Price)}</span>
                                    <span class="text-xs text-coffee-accent font-semibold">${prod.Unit}</span>
                                </div>
                                
                                <div class="space-y-1">
                                    <label class="text-[10px] uppercase tracking-wider text-coffee-accent/60 block font-sans">Mức độ rang</label>
                                    <select id="roast-${prod.Id}" class="w-full bg-coffee border border-coffee-lighter text-sm text-white rounded px-3 py-2 focus:outline-none focus:border-coffee-gold cursor-pointer transition-colors duration-200">
                                        ${optionsHtml}
                                    </select>
                                </div>
                                
                                <div class="grid grid-cols-2 gap-2 pt-1">
                                    <button onclick="quickAddToCart(${prod.Id}, '${prod.Name}', ${prod.Price}, '${prod.ImageUrl}')" class="border border-coffee-gold text-coffee-gold hover:bg-coffee-gold hover:text-coffee-dark text-xs font-bold py-2.5 rounded transition-all duration-300">
                                        THÊM GIỎ HÀNG
                                    </button>
                                    <button onclick="quickBuyNow(${prod.Id}, '${prod.Name}', ${prod.Price}, '${prod.ImageUrl}')" class="bg-forest hover:bg-forest-hover text-white text-xs font-bold py-2.5 rounded transition-all duration-300">
                                        MUA NGAY
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
